<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  
  <title>Frontend Mentor | Product preview card component</title>

</head>
<body>
  <main>
    <div class="card">
      <img src="images/image-product-desktop.jpg" alt="product-preview" aria-colspan="1" id="product-pic">
      <div class="description">
        <p style="margin: 20px 0 -3px 0; font-size: 12px;">P E R F U M E</p>

        <h1>Gabrielle Essence Eau De Parfum</h1>

        <p style="line-height: 20px; margin-bottom: -10px;">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
        Perfumer-Creator for the House of CHANEL.</p>
        
        <div class="price">
          <p id="new-price">$149.99</p>
          <p id="old-price"><strike>$169.99</strike></p>
        </div>

        <button type="button"><img src="images/icon-cart.svg" alt="icon-cart" style="margin-right: 10px;">Add to Cart</button>
      </div>
    </div>
  </main>
  <footer>
    <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="#">nightee_web</a>.
    </div>
  </footer>
</body>
</html>
